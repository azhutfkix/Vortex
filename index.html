<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Timer Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 900px;
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 15px;
}

.title {
    font-size: 1.2rem;
    margin-bottom: 10px;
}

.timer {
    font-size: 1.8rem;
    font-weight: bold;
}

.open { color: #00ff9d; }
.closed { color: #ff4d4d; }

.telegram {
    margin-top: 30px;
}

.telegram a {
    display: inline-block;
    padding: 12px 20px;
    background: #0088cc;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    margin: 5px;
}
</style>
</head>

<body>

<div class="container">
    <h1>VORTEX TIMER PRO</h1>

    <div class="grid">

        <div class="card">
            <div class="title">Forex Market</div>
            <div id="forexStatus"></div>
            <div class="timer" id="forexTimer"></div>
        </div>

        <div class="card">
            <div class="title">London Session</div>
            <div id="londonStatus"></div>
            <div class="timer" id="londonTimer"></div>
        </div>

        <div class="card">
            <div class="title">New York Session</div>
            <div id="nyStatus"></div>
            <div class="timer" id="nyTimer"></div>
        </div>

        <div class="card">
            <div class="title">NASDAQ / S&P 500</div>
            <div id="usStatus"></div>
            <div class="timer" id="usTimer"></div>
        </div>

    </div>

    <div class="telegram">
        <a href="https://t.me/unchainedtradingg" target="_blank">Join My Telegram</a>
        <a href="https://t.me/AhmadVortex" target="_blank">@AhmadVortex</a>
    </div>
</div>

<script>

// ===== TIME HELPERS =====
function getNYTime() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
}

// ===== DISPLAY =====
function format(diff) {
    let h = Math.floor(diff / 3600000);
    let m = Math.floor((diff % 3600000) / 60000);
    let s = Math.floor((diff % 60000) / 1000);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ===== NOTIFICATION =====
function notify(msg) {
    if (Notification.permission === "granted") {
        new Notification(msg);
    }
}

// Ask permission once
if (Notification.permission !== "granted") {
    Notification.requestPermission();
}

// ===== FOREX =====
function forexSession(now) {
    let day = now.getDay();
    let hour = now.getHours();

    let open = new Date(now);
    open.setHours(17,0,0,0);

    let close = new Date(now);
    close.setHours(17,0,0,0);
    close.setDate(close.getDate() + (5 - day));

    if (day === 6 || (day === 0 && hour < 17) || (day === 5 && hour >= 17)) {
        let nextOpen = new Date(open);
        if (day === 5) nextOpen.setDate(nextOpen.getDate() + 2);
        if (day === 6) nextOpen.setDate(nextOpen.getDate() + 1);

        return { open:false, diff: nextOpen - now };
    }

    return { open:true, diff: close - now };
}

// ===== GENERIC SESSION =====
function sessionTimer(startHour, endHour, now) {
    let start = new Date(now);
    let end = new Date(now);

    start.setHours(startHour,0,0,0);
    end.setHours(endHour,0,0,0);

    if (now < start) {
        return { open:false, diff: start - now };
    }

    if (now >= start && now < end) {
        return { open:true, diff: end - now };
    }

    start.setDate(start.getDate() + 1);
    return { open:false, diff: start - now };
}

// ===== UPDATE LOOP =====
let lastForexState = false;

function update() {
    let now = getNYTime();

    // Forex
    let forex = forexSession(now);
    document.getElementById("forexStatus").innerText =
        forex.open ? "OPEN (Closes In)" : "Closed (Opens In)";
    document.getElementById("forexStatus").className =
        forex.open ? "open" : "closed";
    document.getElementById("forexTimer").innerText = format(forex.diff);

    if (!lastForexState && forex.open) {
        notify("Forex Market is now OPEN 🚀");
    }
    lastForexState = forex.open;

    // London (3 AM - 12 PM NY time)
    let london = sessionTimer(3,12,now);
    document.getElementById("londonStatus").innerText =
        london.open ? "OPEN" : "Closed";
    document.getElementById("londonStatus").className =
        london.open ? "open" : "closed";
    document.getElementById("londonTimer").innerText = format(london.diff);

    // New York (8 AM - 5 PM NY time)
    let ny = sessionTimer(8,17,now);
    document.getElementById("nyStatus").innerText =
        ny.open ? "OPEN" : "Closed";
    document.getElementById("nyStatus").className =
        ny.open ? "open" : "closed";
    document.getElementById("nyTimer").innerText = format(ny.diff);

    // NASDAQ / S&P (9:30 AM - 4 PM NY time)
    let start = new Date(now);
    let end = new Date(now);

    start.setHours(9,30,0,0);
    end.setHours(16,0,0,0);

    let us;
    if (now < start) {
        us = { open:false, diff: start - now };
    } else if (now < end) {
        us = { open:true, diff: end - now };
    } else {
        start.setDate(start.getDate() + 1);
        us = { open:false, diff: start - now };
    }

    document.getElementById("usStatus").innerText =
        us.open ? "OPEN" : "Closed";
    document.getElementById("usStatus").className =
        us.open ? "open" : "closed";
    document.getElementById("usTimer").innerText = format(us.diff);
}

setInterval(update, 1000);
update();

</script>

</body>
</html>
